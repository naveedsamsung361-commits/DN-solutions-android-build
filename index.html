<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DN Solutions Machine Fix Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg: #071229; /* dark navy */
  --surface: #0f1a2b;
  --surface-2: #0b1726;
  --line: #133048;
  --fg: #e6f6ff;
  --muted: #9fbcd8;
  --accent: #1fb6ff; /* electric blue */
  --accent-fg: #021124;
  --accent-soft: rgba(31,182,255,0.08);
  --open: #f0b560;
  --open-bg: rgba(240,181,96,0.08);
  --prog: #7ad0ff;
  --prog-bg: rgba(122,208,255,0.06);
  --fixed: #66c898;
  --fixed-bg: rgba(102,200,152,0.06);
  --rep: #f59088;
  --rep-bg: rgba(245,144,136,0.06);
  --scrim: rgba(2,6,12,0.6);
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    /* keep dark look by default but allow light if forced */
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding:14px}
.app{max-width:980px;margin:0 auto}
.brand h1{font:700 26px/1 var(--f-display);letter-spacing:0.06em;text-transform:uppercase;margin:0}
.brand .sub{color:var(--muted);font-size:12px;margin-top:4px}
.top{position:sticky;top:0;background:linear-gradient(0deg, rgba(255,255,255,0.02), transparent);backdrop-filter:blur(6px);padding:10px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:20}
.btn{min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid transparent;background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer}
.btn.primary{background:linear-gradient(90deg,var(--accent),#0aa3ff);color:var(--accent-fg);box-shadow:0 6px 18px rgba(31,182,255,0.12)}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04)}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);padding:12px;border-radius:8px;border:1px solid var(--line)}
.stat .k{font:600 12px var(--f-display);color:var(--muted);text-transform:uppercase}
.stat .v{font:500 20px var(--f-mono)}
.tabs{display:flex;gap:8px;margin:18px 0;overflow:auto}
.tab{padding:8px 12px;background:transparent;border-radius:8px;border:1px solid transparent;color:var(--muted);cursor:pointer;font:600 14px var(--f-display);text-transform:uppercase}
.tab[aria-selected="true"]{background:linear-gradient(90deg, rgba(31,182,255,0.06), rgba(31,182,255,0.02));color:var(--fg);border-color:rgba(31,182,255,0.12)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,0.03);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.list{display:grid;gap:12px}
@media(min-width:840px){.list{grid-template-columns:1fr 1fr}}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);padding:12px;border-radius:10px;border:1px solid var(--line);}
.card h3{margin:0;font:700 16px var(--f-display)}
.pills{display:flex;gap:6px;justify-content:flex-end}
.pill{padding:4px 8px;border-radius:6px;font:600 12px var(--f-display);text-transform:uppercase}
.pill.open{background:var(--open-bg);color:var(--open)}
.pill.prog{background:var(--prog-bg);color:var(--prog)}
.pill.fixed{background:var(--fixed-bg);color:var(--fixed)}
.pill.rep{background:var(--rep-bg);color:var(--rep)}
.empty{padding:20px;border-radius:10px;border:1px dashed var(--line);background:var(--surface)}
.sheet{position:fixed;inset:0;display:flex;justify-content:flex-end;z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{width:min(600px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column}
.panel-body{padding:16px;overflow:auto;flex:1}
.panel-foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px}
/* mobile friendly adjustments */
@media(max-width:420px){
  .brand h1{font-size:18px}
  .btn{min-height:44px;padding:10px}
  body{padding:10px}
}
</style>
</head>
<body data-theme="dark">
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>DN Solutions · Machine Fix Log</h1>
      <p class="sub">machine catalogue · faults · repeats · repairs</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn ghost" id="btnImportFile" title="Import CSV">Import</button>
      <button class="btn primary" data-act="new" id="btnNew">+ Log a problem</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input id="importFile" type="file" accept="text/csv" style="display:none">
