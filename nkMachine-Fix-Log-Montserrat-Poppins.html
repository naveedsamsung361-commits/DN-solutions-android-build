<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Machine Fix Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column that widens on desktop. Sticky header holds the main action, then a summary strip, four tabs (Jobs, Repeats, Machines, Reports), and a side sheet for the record form. Look: dark service-bay theme, steel-blue accent, amber / green / red reserved for status. */
:root {
  color-scheme: dark;
  --bg: #071229;
  --surface: #0f1a2b;
  --surface-2: #0b1726;
  --line: #1b3550;
  --fg: #e6f6ff;
  --muted: #9fbcd8;
  --accent: #1fb6ff;
  --accent-fg: #021124;
  --accent-soft: rgba(31,182,255,0.10);
  --open: #f0b560;
  --open-bg: #3a2c15;
  --prog: #8fc0ea;
  --prog-bg: #1f3447;
  --fixed: #66c898;
  --fixed-bg: #173429;
  --rep: #f59088;
  --rep-bg: #3d201e;
  --scrim: rgba(0, 0, 0, 0.62);
  --f-display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}

/* Needed because several classes below set display, which would otherwise override the hidden attribute. */
[hidden] { display: none !important; }

* { box-sizing: border-box; }
html { scroll-padding-top: 80px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.55 var(--f-body);
  padding-inline: 16px;
  padding-block: 0 48px;
}
.app { max-width: 980px; margin-inline: auto; }
h1, h2, h3, p, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { min-width: 0; }
.brand h1 {
  font: 800 22px/1.1 var(--f-display);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.brand .sub { font: 400 12px var(--f-mono); color: var(--muted); margin-top: 4px; }
.btn {
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { background: var(--rep); border-color: var(--rep); color: var(--accent-fg); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 40px; padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Summary strip */
.stats {
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); padding: 10px 14px; min-width: 0; }
.stat .k { font: 600 11px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font: 500 22px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat .v.warn { color: var(--rep); }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-block: 18px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 10px 14px;
  min-height: 44px;
  font: 600 13px var(--f-display);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font: 500 12px var(--f-mono); margin-left: 6px; }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
.toolbar .grow { flex: 1 1 240px; min-width: 0; }
.toolbar .cat { flex: 0 1 200px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.chip {
  min-height: 36px;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.machine { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

input, select, textarea {
  width: 100%;
  font: 400 16px/1.4 var(--f-body);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--fg);
}
textarea { resize: vertical; min-height: 78px; }
input.mono-in { font-family: var(--f-mono); font-size: 15px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }

/* Lists and cards */
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-block: 16px 10px; }
.list-head .count { font: 500 13px var(--f-mono); color: var(--muted); }
.banner {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  margin-top: 16px; padding: 10px 14px; border-radius: 8px;
  background: var(--accent-soft); border: 1px solid var(--line); font-size: 14px;
}
.list { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 840px) { .list { grid-template-columns: 1fr 1fr; } }
.card {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  display: grid;
  gap: 8px;
  align-content: start;
}
.card[role="button"] { cursor: pointer; }
.card[role="button"]:hover { border-color: var(--accent); }
.card h3 { font: 700 16px/1.25 var(--f-display); letter-spacing: 0.01em; overflow-wrap: anywhere; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; flex-shrink: 0; max-width: 55%; }
.pill {
  font: 700 10.5px/1 var(--f-display);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.pill.open { background: var(--open-bg); color: var(--open); }
.pill.prog { background: var(--prog-bg); color: var(--prog); }
.pill.fixed { background: var(--fixed-bg); color: var(--fixed); }
.pill.rep { background: var(--rep-bg); color: var(--rep); }
.pill.ex { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.urg { background: var(--rep); color: var(--accent-fg); }
.meta { font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; overflow-wrap: anywhere; }
.meta .sn { font: 500 13px var(--f-mono); color: var(--fg); }
.times { display: flex; flex-wrap: wrap; gap: 2px 16px; font: 400 12.5px/1.5 var(--f-mono); color: var(--muted); }
.times b { font-weight: 500; color: var(--fg); }
.clamp { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.clamp b { font: 600 11px var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }

.empty {
  padding: 28px 18px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  background: var(--surface);
  text-align: left;
  display: grid;
  gap: 10px;
  justify-items: start;
}
.empty h3 { font: 700 16px var(--f-display); letter-spacing: 0.03em; text-transform: uppercase; }
.empty p { color: var(--muted); max-width: 56ch; }

/* Repeats */
.block + .block { margin-top: 28px; }
.block > h2 { font: 700 16px var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
.block > .hint { color: var(--muted); font-size: 14px; margin-bottom: 12px; max-width: 62ch; }
.count-badge { font: 700 22px/1 var(--f-display); letter-spacing: 0.01em; color: var(--rep); white-space: nowrap; }
.occ { list-style: none; padding: 0; display: grid; border-top: 1px solid var(--line); }
.occ li { border-bottom: 1px solid var(--line); }
.occ-btn {
  width: 100%;
  min-height: 44px;
  display: grid;
  grid-template-columns: 6.6rem minmax(0, 1fr) auto;
  gap: 4px 10px;
  align-items: baseline;
  text-align: left;
  padding: 8px 2px;
  background: none;
  border: 0;
  cursor: pointer;
  font-size: 13.5px;
  touch-action: manipulation;
}
.occ-btn:hover { background: var(--surface-2); }
.occ-btn .d { font: 500 12.5px var(--f-mono); }
.occ-btn .gap { font: 400 12px var(--f-mono); color: var(--muted); }
.occ-btn .o-txt { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.avg { font-size: 14px; }
.avg b { font-weight: 600; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; gap: 4px; }
.bar-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.bar-top span:first-child { min-width: 0; overflow-wrap: anywhere; }
.bar-top .c { font: 500 13px var(--f-mono); white-space: nowrap; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.cols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; border-bottom: 1px solid var(--line); }
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
.col i { display: block; width: 100%; max-width: 48px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.col .cn { font: 500 13px var(--f-mono); }
.cols-l { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 6px; font: 400 12px var(--f-mono); color: var(--muted); text-align: center; }

/* Machines */
.stat-row { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 12.5px var(--f-mono); color: var(--muted); }
.stat-row b { color: var(--fg); font-weight: 500; }

.foot { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 70ch; }

/* Side sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.panel {
  position: relative;
  width: min(600px, 100%);
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel form { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.panel-head {
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.panel-head h2 { font: 700 17px var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; }
.panel-body { padding: 16px; overflow-y: auto; flex: 1; display: grid; gap: 22px; align-content: start; }
.panel-foot {
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.foot-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.foot-row .spacer { margin-right: auto; }
.sec { display: grid; gap: 12px; }
.sec > h3 { font: 600 12px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.fld { display: grid; gap: 5px; min-width: 0; align-content: start; }
.fld label, .fld legend, .lbl { font-size: 13px; font-weight: 600; padding: 0; }
.fld .help { font-size: 12.5px; color: var(--muted); }
fieldset.fld { border: 0; margin: 0; padding: 0; min-width: 0; }
.seg { display: flex; position: relative; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label {
  flex: 1; text-align: center; padding: 9px 8px; border: 1px solid var(--line); font-size: 14px; font-weight: 500;
  cursor: pointer; background: var(--surface);
}
.seg label:first-of-type { border-radius: 6px 0 0 6px; }
.seg label:last-of-type { border-radius: 0 6px 6px 0; }
.seg label + input + label { border-left: 0; }
.seg input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { padding: 10px 12px; border-radius: 6px; font-size: 14px; background: var(--rep-bg); color: var(--rep); }
.note.info { background: var(--accent-soft); color: var(--fg); }
.err { color: var(--rep); font-size: 14px; font-weight: 500; margin-bottom: 8px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  z-index: 50; max-width: min(90vw, 420px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px;
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (max-width: 639px) {
  body { padding-inline: 12px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
  .top { gap: 8px; padding-block: 10px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .brand h1 { font-size: clamp(17px, 5vw, 22px); }
  .tabs { gap: 2px; }
  .tab { padding-inline: 12px; }
  .toolbar { gap: 8px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Machine Fix Log</h1>
      <p class="sub">problems · repeats · repairs</p>
    </div>
    <button type="button" class="btn primary" data-act="new" id="btnNew">+ Log a problem</button>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  var CATS = ['Spindle', 'Axis / servo', 'Tool changer', 'Coolant', 'Lubrication', 'Hydraulic / pneumatic', 'Electrical', 'Controller / software', 'Chip conveyor', 'Door / safety', 'Other'];
  var STATUSES = ['Open', 'In progress', 'Fixed'];
  var VIA = ['Phone call', 'Remote', 'On-site visit'];
  var LS_KEY = 'machine-fix-log-v1';
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var S = { jobs: [], loaded: false, mode: 'pending', tab: 'jobs', q: '', status: 'all', cat: 'all', machine: '', urgent: false, editing: null, dbError: '' };
  var D = null;
  var col = null;
  var lastFocus = null;
  var toastTimer = null;

  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function machineKey(j) { return norm(j.serial) || norm(j.machine); }
  function problemKey(j) { return norm(j.problem); }
  function p2(n) { return String(n).padStart(2, '0'); }
  function nowLocal() {
    var d = new Date();
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function parse(s) { if (!s) return null; var d = new Date(s); return isNaN(d.getTime()) ? null : d; }
  function fmtDate(s) { var d = parse(s); return d ? p2(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : '—'; }
  function fmtTime(s) {
    var d = parse(s); if (!d) return '';
    var h = d.getHours(), ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    return h + ':' + p2(d.getMinutes()) + ' ' + ap;
  }
  function fmtDT(s) { return parse(s) ? fmtDate(s) + ', ' + fmtTime(s) : '—'; }
  function dur(ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    if (m < 60) return m + ' min';
    var h = Math.floor(m / 60);
    if (h < 48) return h + ' h' + (m % 60 ? ' ' + (m % 60) + ' m' : '');
    var d = Math.floor(h / 24);
    return d + ' d' + (h % 24 ? ' ' + (h % 24) + ' h' : '');
  }
  function fixMs(j) {
    if (j.status !== 'Fixed') return null;
    var a = parse(j.reportedAt), b = parse(j.fixedAt);
    return a && b && b >= a ? b - a : null;
  }
  function daysBetween(a, b) { var x = parse(a), y = parse(b); return x && y ? (y - x) / 86400000 : 0; }
  function ord(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function newId() { return 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- derived data ---------- */
  function derive() {
    var asc = S.jobs.slice().sort(function (a, b) {
      return String(a.reportedAt || '').localeCompare(String(b.reportedAt || '')) || String(a.id).localeCompare(String(b.id));
    });
    var groups = new Map(), machines = new Map(), problems = new Map(), occ = {};
    asc.forEach(function (j) {
      var mk = machineKey(j), pk = problemKey(j), gk = mk + '|' + pk;
      var g = groups.get(gk);
      if (!g) { g = { key: gk, mk: mk, pk: pk, jobs: [] }; groups.set(gk, g); }
      g.jobs.push(j);
      occ[j.id] = { n: g.jobs.length, g: g };
      var m = machines.get(mk);
      if (!m) { m = { mk: mk, jobs: [], repeats: 0 }; machines.set(mk, m); }
      m.jobs.push(j);
      m.model = j.machine || m.model; m.serial = j.serial || m.serial; m.customer = j.customer || m.customer;
      var p = problems.get(pk);
      if (!p) { p = { pk: pk, count: 0, machines: new Set() }; problems.set(pk, p); }
      p.count++; p.machines.add(mk); p.title = j.problem; p.category = j.category;
    });
    function lastOf(g) { return String(g.jobs[g.jobs.length - 1].reportedAt || ''); }
    var repeatGroups = Array.from(groups.values()).filter(function (g) { return g.jobs.length >= 2; })
      .sort(function (a, b) { return b.jobs.length - a.jobs.length || lastOf(b).localeCompare(lastOf(a)); });
    repeatGroups.forEach(function (g) { var m = machines.get(g.mk); if (m) m.repeats++; });
    var machineList = Array.from(machines.values()).sort(function (a, b) {
      return String(b.jobs[b.jobs.length - 1].reportedAt || '').localeCompare(String(a.jobs[a.jobs.length - 1].reportedAt || ''));
    });
    var problemList = Array.from(problems.values()).sort(function (a, b) { return b.count - a.count || String(a.title).localeCompare(String(b.title)); });
    return { asc: asc, groups: groups, repeatGroups: repeatGroups, machines: machines, machineList: machineList, problemList: problemList, occ: occ };
  }

  /* ---------- storage ---------- */
  function lsLoad() {
    try {
      var r = localStorage.getItem(LS_KEY), a = r ? JSON.parse(r) : [];
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.jobs)); } catch (e) { toast('Could not save on this device.'); } }
  function writeError(e) {
    if (e && e.code === 'quota_exceeded') return 'The log is full. Delete old records and try again.';
    if (e && e.code === 'invalid_argument') return 'This page did not accept the change. If you only have view access, ask the owner for edit access.';
    return 'Could not save. Check your connection and try again.';
  }
  var store = {
    save: function (job) {
      var id = job.id, data = {};
      Object.keys(job).forEach(function (k) { if (k !== 'id') data[k] = job[k]; });
      if (S.mode === 'db') return col.doc(id).set(data);
      var i = S.jobs.findIndex(function (x) { return x.id === id; });
      if (i >= 0) S.jobs[i] = job; else S.jobs.push(job);
      lsSave(); renderAll(false);
      return Promise.resolve();
    },
    remove: function (id) {
      if (S.mode === 'db') return col.doc(id).delete();
      S.jobs = S.jobs.filter(function (x) { return x.id !== id; });
      lsSave(); renderAll(false);
      return Promise.resolve();
    }
  };

  /* ---------- toast ---------- */
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  /* ---------- summary, tabs, footer ---------- */
  function renderStats() {
    var open = S.jobs.filter(function (j) { return j.status !== 'Fixed'; }).length;
    var fixed = S.jobs.length - open;
    var ms = S.jobs.map(fixMs).filter(function (x) { return x != null; });
    var avg = ms.length ? dur(ms.reduce(function (a, b) { return a + b; }, 0) / ms.length) : '—';
    var rep = D.repeatGroups.length;
    $('#stats').innerHTML =
      '<div class="stat"><div class="k">Open now</div><div class="v">' + open + '</div></div>' +
      '<div class="stat"><div class="k">Fixed</div><div class="v">' + fixed + '</div></div>' +
      '<div class="stat"><div class="k">Repeat problems</div><div class="v' + (rep ? ' warn' : '') + '">' + rep + '</div></div>' +
      '<div class="stat"><div class="k">Average fix time</div><div class="v">' + esc(avg) + '</div></div>';
  }
  function renderTabs() {
    var tabs = [['jobs', 'Jobs', S.jobs.length], ['repeats', 'Repeats', D.repeatGroups.length], ['machines', 'Machines', D.machineList.length], ['reports', 'Reports', '']];
    $('#tabs').innerHTML = tabs.map(function (t) {
      return '<button type="button" role="tab" class="tab" data-act="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + (t[2] === '' ? '' : '<span class="n">' + t[2] + '</span>') + '</button>';
    }).join('');
  }
  function renderFoot() {
    var m = S.mode, t = '';
    if (S.dbError) t = 'Could not reach the saved records. Reload the page to try again.';
    else if (m === 'db') t = 'Records are kept with this page, so they are still here when you reopen it on your phone or computer. Use Export CSV for a copy.';
    else if (m === 'local') t = 'Records are saved in this browser only. Opening the page on another device will not show them. Use Export CSV for a copy.';
    $('#foot').textContent = t;
  }

  /* ---------- views ---------- */
  function renderAll(force) { D = derive(); renderStats(); renderTabs(); renderView(force); renderFoot(); }

  function renderView(force) {
    var v = $('#view');
    if (!S.loaded) { v.innerHTML = '<div class="empty"><h3>Loading</h3><p>Getting your records.</p></div>'; return; }
    if (S.tab === 'jobs') {
      if (!force && $('#q', v)) { renderJobList(); return; }
      v.innerHTML = jobsShell(); renderJobList();
    } else if (S.tab === 'repeats') { v.innerHTML = repeatsHTML(); }
    else if (S.tab === 'machines') { v.innerHTML = machinesHTML(); }
    else { v.innerHTML = reportsHTML(); }
  }

  function jobsShell() {
    var chips = [['all', 'All'], ['Open', 'Open'], ['In progress', 'In progress'], ['Fixed', 'Fixed']].map(function (c) {
      return '<button type="button" class="chip" data-act="status" data-v="' + c[0] + '" aria-pressed="' + (S.status === c[0]) + '">' + c[1] + '</button>';
    }).join('');
    var mach = '';
    if (S.machine) {
      var m = D.machines.get(S.machine);
      var label = m ? [m.model, m.serial].filter(Boolean).join(' · ') : S.machine;
      mach = '<button type="button" class="chip machine" data-act="clearMachine">Machine: ' + esc(label) + ' &times;</button>';
    }
    var cats = '<option value="all">All categories</option>' + CATS.map(function (c) {
      return '<option' + (S.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');
    return '<div class="toolbar">' +
      '<div class="grow"><label class="sr" for="q">Search records</label><input id="q" type="search" placeholder="Search machine, serial, problem, alarm code" value="' + esc(S.q) + '" autocomplete="off"></div>' +
      '<div class="cat"><label class="sr" for="catSel">Category</label><select id="catSel">' + cats + '</select></div>' +
      '</div><div class="chips" role="group" aria-label="Status">' + chips + '<button type="button" class="chip" data-act="urgent" aria-pressed="' + S.urgent + '">Urgent only</button>' + mach + '</div><div id="jobList"></div>';
  }

  function visibleJobs() {
    var q = norm(S.q);
    return S.jobs.filter(function (j) {
      if (S.status !== 'all' && j.status !== S.status) return false;
      if (S.cat !== 'all' && j.category !== S.cat) return false;
      if (S.machine && machineKey(j) !== S.machine) return false;
      if (S.urgent && j.priority !== 'Urgent') return false;
      if (q) {
        var hay = norm([j.machine, j.serial, j.customer, j.problem, j.category, j.code, j.what, j.cause, j.fix, j.parts].join(' '));
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) { return String(b.reportedAt || '').localeCompare(String(a.reportedAt || '')); });
  }

  function jobCard(j) {
    var info = D.occ[j.id] || { n: 1 };
    var st = j.status === 'Fixed' ? 'fixed' : j.status === 'In progress' ? 'prog' : 'open';
    var pills = '<span class="pill ' + st + '">' + esc(j.status) + '</span>';
    if (j.priority === 'Urgent') pills = '<span class="pill urg">Urgent</span>' + pills;
    if (info.n >= 2) pills += '<span class="pill rep">Repeat · ' + ord(info.n) + ' time</span>';
    if (j.example) pills += '<span class="pill ex">Example</span>';
    var meta = '<span>' + esc(j.machine) + '</span>' + (j.serial ? '<span class="sn">' + esc(j.serial) + '</span>' : '') + (j.customer ? '<span>' + esc(j.customer) + '</span>' : '') + (j.category ? '<span>' + esc(j.category) + '</span>' : '') + (j.via ? '<span>' + esc(j.via) + '</span>' : '');
    var times = '<span>Reported <b>' + esc(fmtDT(j.reportedAt)) + '</b></span>';
    if (j.status === 'Fixed') {
      var ms = fixMs(j);
      times += '<span>Fixed <b>' + esc(fmtDT(j.fixedAt)) + '</b></span>' + (ms != null ? '<span>Took <b>' + esc(dur(ms)) + '</b></span>' : '');
    } else {
      var r = parse(j.reportedAt);
      if (r) times += '<span>Open for <b>' + esc(dur(Date.now() - r.getTime())) + '</b></span>';
    }
    var fix = j.fix ? '<p class="clamp"><b>Fix</b>' + esc(j.fix) + '</p>' : (j.what ? '<p class="clamp"><b>Issue</b>' + esc(j.what) + '</p>' : '');
    return '<article class="card" role="button" tabindex="0" data-act="open" data-id="' + esc(j.id) + '">' +
      '<div class="card-head"><h3>' + esc(j.problem) + '</h3><div class="pills">' + pills + '</div></div>' +
      '<p class="meta">' + meta + '</p><p class="times">' + times + '</p>' + fix + '</article>';
  }

  function renderJobList() {
    var box = $('#jobList'); if (!box) return;
    var list = visibleJobs(), html = '';
    var ex = S.jobs.filter(function (j) { return j.example; }).length;
    if (ex) html += '<div class="banner"><span>These ' + ex + ' records are examples so you can see how the log works.</span><button type="button" class="btn small" data-act="removeExamples">Remove examples</button></div>';
    if (!S.jobs.length) {
      html += '<div class="empty"><h3>No problems logged yet</h3><p>Log each machine problem as it comes in: what broke, the alarm code, and when it was reported. When you fix it, add how you fixed it. If the same problem comes back on the same machine, it is counted on the Repeats tab.</p><button type="button" class="btn primary" data-act="new">Log your first problem</button></div>';
    } else {
      html += '<div class="list-head"><span class="count">' + list.length + (list.length === 1 ? ' record' : ' records') + '</span><button type="button" class="btn small ghost" data-act="export">Export CSV</button></div>';
      if (!list.length) html += '<div class="empty"><h3>Nothing matches</h3><p>No record fits the search or filters.</p><button type="button" class="btn" data-act="clearFilters">Clear filters</button></div>';
      else html += '<div class="list">' + list.map(jobCard).join('') + '</div>';
    }
    box.innerHTML = html;
  }

  function repGroupHTML(g) {
    var jobs = g.jobs, last = jobs[jobs.length - 1], first = jobs[0];
    var gaps = [];
    for (var i = 1; i < jobs.length; i++) gaps.push(daysBetween(jobs[i - 1].reportedAt, jobs[i].reportedAt));
    var avg = Math.round(gaps.reduce(function (a, b) { return a + b; }, 0) / gaps.length);
    var avgTxt = avg < 1 ? 'Comes back within a day' : 'Comes back about every ' + avg + (avg === 1 ? ' day' : ' days');
    var rows = jobs.map(function (j, idx) {
      var txt;
      if (j.status === 'Fixed') txt = j.fix || 'Fixed, no notes added';
      else txt = (j.status === 'In progress' ? 'In progress' : 'Not fixed yet') + (j.fix ? ' · ' + j.fix : '');
      var gap = idx ? '+' + Math.round(daysBetween(jobs[idx - 1].reportedAt, j.reportedAt)) + ' d' : 'first';
      return '<li><button type="button" class="occ-btn" data-act="open" data-id="' + esc(j.id) + '"><span class="d">' + esc(fmtDate(j.reportedAt)) + '</span><span class="o-txt">' + esc(txt) + '</span><span class="gap">' + gap + '</span></button></li>';
    }).join('');
    var meta = '<span>' + esc(last.machine) + '</span>' + (last.serial ? '<span class="sn">' + esc(last.serial) + '</span>' : '') + (last.customer ? '<span>' + esc(last.customer) + '</span>' : '');
    return '<article class="card"><div class="card-head"><h3>' + esc(last.problem) + '</h3><span class="count-badge">' + jobs.length + '&times;</span></div>' +
      '<p class="meta">' + meta + '</p><ol class="occ">' + rows + '</ol>' +
      '<p class="avg"><b>' + avgTxt + '.</b> First seen ' + esc(fmtDate(first.reportedAt)) + ', last ' + esc(fmtDate(last.reportedAt)) + '.</p>' +
      '<div><button type="button" class="btn small" data-act="again" data-gk="' + esc(g.key) + '">Log it again</button></div></article>';
  }

  function repeatsHTML() {
    var h = '<section class="block"><h2>Same problem, same machine</h2><p class="hint">A problem counts as a repeat when the same problem name is logged on the same machine (matched by serial number) more than once.</p>';
    if (!D.repeatGroups.length) h += '<div class="empty"><h3>No repeats yet</h3><p>When the same problem is logged twice on one machine, it shows up here with every date, how it was fixed each time, and how often it comes back.</p></div>';
    else h += '<div class="list">' + D.repeatGroups.map(repGroupHTML).join('') + '</div>';
    h += '</section>';
    if (D.problemList.length) {
      var top = D.problemList.slice(0, 8), max = top[0].count;
      h += '<section class="block"><h2>Most common problems</h2><p class="hint">Across all machines.</p><div class="bars">' + top.map(function (p) {
        var n = p.machines.size;
        return '<div class="bar-row"><div class="bar-top"><span>' + esc(p.title) + '</span><span class="c">' + p.count + '&times; · ' + n + (n === 1 ? ' machine' : ' machines') + '</span></div><div class="bar"><i style="width:' + Math.max(4, Math.round(p.count / max * 100)) + '%"></i></div></div>';
      }).join('') + '</div></section>';
    }
    return h;
  }

  function machinesHTML() {
    if (!D.machineList.length) return '<div class="empty"><h3>No machines yet</h3><p>Machines appear here once you log a problem. Each one shows how many jobs and repeats it has had.</p></div>';
    return '<div class="list">' + D.machineList.map(function (m) {
      var last = m.jobs[m.jobs.length - 1];
      var open = m.jobs.filter(function (j) { return j.status !== 'Fixed'; }).length;
      var meta = (m.serial ? '<span class="sn">' + esc(m.serial) + '</span>' : '') + (m.customer ? '<span>' + esc(m.customer) + '</span>' : '');
      return '<article class="card" role="button" tabindex="0" data-act="machine" data-mk="' + esc(m.mk) + '">' +
        '<div class="card-head"><h3>' + esc(m.model || m.serial) + '</h3>' + (open ? '<div class="pills"><span class="pill open">' + open + ' open</span></div>' : '') + '</div>' +
        '<p class="meta">' + meta + '</p>' +
        '<p class="stat-row"><span>Jobs <b>' + m.jobs.length + '</b></span><span>Repeat problems <b>' + m.repeats + '</b></span></p>' +
        '<p class="clamp"><b>Last</b>' + esc(fmtDate(last.reportedAt)) + ' · ' + esc(last.problem) + '</p></article>';
    }).join('') + '</div>';
  }

  function reportsHTML() {
    if (!S.jobs.length) return '<div class="empty"><h3>No reports yet</h3><p>Once you have logged some problems, this tab shows jobs per month, which categories break most, how long fixes take, and your slowest repairs.</p></div>';
    var months = [], now = new Date();
    for (var i = 5; i >= 0; i--) {
      var x = new Date(now.getFullYear(), now.getMonth() - i, 1);
      months.push({ key: x.getFullYear() + '-' + p2(x.getMonth() + 1), label: MONTHS[x.getMonth()] + ' ' + String(x.getFullYear()).slice(2), n: 0 });
    }
    S.jobs.forEach(function (j) { var k = String(j.reportedAt || '').slice(0, 7); months.forEach(function (m) { if (m.key === k) m.n++; }); });
    var mx = Math.max.apply(null, months.map(function (m) { return m.n; })) || 1;
    var h = '<section class="block"><h2>Jobs per month</h2><p class="hint">Problems reported in the last 6 months.</p>' +
      '<div class="cols" style="height:150px">' + months.map(function (m) { return '<div class="col"><span class="cn">' + m.n + '</span><i style="height:' + Math.max(2, Math.round(m.n / mx * 100)) + 'px"></i></div>'; }).join('') + '</div>' +
      '<div class="cols-l">' + months.map(function (m) { return '<span>' + esc(m.label) + '</span>'; }).join('') + '</div></section>';

    var cats = {};
    S.jobs.forEach(function (j) {
      var c = j.category || 'Other', o = cats[c] || (cats[c] = { c: c, n: 0, ms: [] });
      o.n++; var ms = fixMs(j); if (ms != null) o.ms.push(ms);
    });
    var cl = Object.keys(cats).map(function (k) { return cats[k]; }).sort(function (a, b) { return b.n - a.n || a.c.localeCompare(b.c); });
    var cmax = cl[0].n;
    h += '<section class="block"><h2>By category</h2><p class="hint">Which parts of the machine cause the most calls, and how long fixes take.</p><div class="bars">' + cl.map(function (o) {
      var avg = o.ms.length ? ' · avg fix ' + dur(o.ms.reduce(function (a, b) { return a + b; }, 0) / o.ms.length) : '';
      return '<div class="bar-row"><div class="bar-top"><span>' + esc(o.c) + '</span><span class="c">' + o.n + '&times;' + esc(avg) + '</span></div><div class="bar"><i style="width:' + Math.max(4, Math.round(o.n / cmax * 100)) + '%"></i></div></div>';
    }).join('') + '</div></section>';

    var via = {};
    S.jobs.forEach(function (j) { var k = j.via || 'Not recorded'; via[k] = (via[k] || 0) + 1; });
    h += '<section class="block"><h2>How you handled them</h2><p class="stat-row">' + Object.keys(via).map(function (k) { return '<span>' + esc(k) + ' <b>' + via[k] + '</b></span>'; }).join('') + '</p></section>';

    var slow = S.jobs.filter(function (j) { return fixMs(j) != null; }).sort(function (a, b) { return fixMs(b) - fixMs(a); }).slice(0, 5);
    if (slow.length) {
      h += '<section class="block"><h2>Slowest fixes</h2><ol class="occ">' + slow.map(function (j) {
        return '<li><button type="button" class="occ-btn" data-act="open" data-id="' + esc(j.id) + '"><span class="d">' + esc(fmtDate(j.reportedAt)) + '</span><span class="o-txt">' + esc(j.problem) + ' · ' + esc(j.machine) + '</span><span class="gap">' + esc(dur(fixMs(j))) + '</span></button></li>';
      }).join('') + '</ol></section>';
    }
    return h;
  }

  /* ---------- record form ---------- */
  function uniq(arr) { var seen = {}, out = []; arr.forEach(function (x) { var k = norm(x); if (x && !seen[k]) { seen[k] = 1; out.push(x); } }); return out; }
  function dl(id, items) { return '<datalist id="' + id + '">' + items.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>'; }

  function sheetHTML(job, pre, title) {
    var v = job || pre || {};
    var status = job ? job.status : 'Open';
    var reported = job ? job.reportedAt : nowLocal();
    var models = uniq(D.asc.map(function (j) { return j.machine; }).reverse());
    var serials = uniq(D.asc.map(function (j) { return j.serial; }).reverse());
    var custs = uniq(D.asc.map(function (j) { return j.customer; }).reverse());
    var probs = uniq(D.asc.map(function (j) { return j.problem; }).reverse());
    var cats = CATS.map(function (c) { return '<option' + ((v.category || 'Other') === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('');
    var seg = STATUSES.map(function (s, i) {
      return '<input type="radio" name="status" id="f-st-' + i + '" value="' + s + '"' + (s === status ? ' checked' : '') + '><label for="f-st-' + i + '">' + s + '</label>';
    }).join('');
    var pri = ['Normal', 'Urgent'].map(function (s, i) {
      return '<input type="radio" name="priority" id="f-pr-' + i + '" value="' + s + '"' + (s === ((job && job.priority) || 'Normal') ? ' checked' : '') + '><label for="f-pr-' + i + '">' + s + '</label>';
    }).join('');
    var viaOpts = '<option value="">Not recorded</option>' + VIA.map(function (x) { return '<option' + (job && job.via === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
    var del = job ? '<button type="button" class="btn spacer" data-act="delAsk">Delete</button>' : '<span class="spacer"></span>';
    return '<div class="scrim" data-act="close"></div>' +
      '<section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><form id="jobForm" novalidate>' +
      '<div class="panel-head"><h2 id="sheetTitle">' + esc(title) + '</h2><button type="button" class="btn small ghost" data-act="close">Close</button></div>' +
      '<div class="panel-body">' +
      '<div class="sec"><h3>Machine</h3><div class="row">' +
      '<div class="fld"><label for="f-machine">Machine model</label><input id="f-machine" list="dl-models" value="' + esc(v.machine) + '" placeholder="e.g. DNM 5700" autocomplete="off"></div>' +
      '<div class="fld"><label for="f-serial">Serial number</label><input id="f-serial" class="mono-in" list="dl-serials" value="' + esc(v.serial) + '" placeholder="Machine serial no." autocomplete="off"><span class="help">Add it so repeats are counted on the same machine.</span></div></div>' +
      '<div class="fld"><label for="f-customer">Customer or site</label><input id="f-customer" list="dl-custs" value="' + esc(v.customer) + '" autocomplete="off"></div>' +
      dl('dl-models', models) + dl('dl-serials', serials) + dl('dl-custs', custs) + dl('dl-probs', probs) + '</div>' +
      '<div class="sec"><h3>Problem</h3>' +
      '<div class="fld"><label for="f-problem">What is the problem?</label><input id="f-problem" list="dl-probs" value="' + esc(v.problem) + '" placeholder="Short name, e.g. Tool changer arm stuck" autocomplete="off"><span class="help">Use the same wording each time so repeats are counted. Pick from the list when it appears.</span></div>' +
      '<div id="repeatHint"></div>' +
      '<div class="row"><div class="fld"><label for="f-category">Category</label><select id="f-category">' + cats + '</select></div>' +
      '<div class="fld"><label for="f-code">Alarm or error code</label><input id="f-code" class="mono-in" value="' + esc(v.code) + '" autocomplete="off"></div></div>' +
      '<fieldset class="fld"><legend>Priority</legend><div class="seg">' + pri + '</div></fieldset>' +
      '<div class="fld"><label for="f-what">How it broke, what the customer saw</label><textarea id="f-what" placeholder="Symptoms, when it happens, what the operator was doing">' + esc(v.what) + '</textarea></div>' +
      '<div class="fld"><label for="f-reported">Reported on</label><input id="f-reported" type="datetime-local" value="' + esc(reported) + '"></div></div>' +
      '<div class="sec"><h3>Fix</h3>' +
      '<fieldset class="fld"><legend>Status</legend><div class="seg">' + seg + '</div></fieldset>' +
      '<div class="fld" id="fixedWrap"' + (status === 'Fixed' ? '' : ' hidden') + '><label for="f-fixed">Fixed on</label><input id="f-fixed" type="datetime-local" value="' + esc(job ? job.fixedAt : '') + '"></div>' +
      '<div class="fld"><label for="f-via">How you handled it</label><select id="f-via">' + viaOpts + '</select></div>' +
      '<div class="fld"><label for="f-cause">Cause, if known</label><input id="f-cause" value="' + esc(job ? job.cause : '') + '" autocomplete="off"></div>' +
      '<div class="fld"><label for="f-fix">How you fixed it</label><textarea id="f-fix" placeholder="Steps you took, settings changed, tests you ran">' + esc(job ? job.fix : '') + '</textarea></div>' +
      '<div class="fld"><label for="f-parts">Parts used</label><input id="f-parts" value="' + esc(job ? job.parts : '') + '" autocomplete="off"></div></div>' +
      '</div>' +
      '<div class="panel-foot"><div id="formErr" class="err" role="alert" hidden></div>' +
      '<div class="foot-row" id="normalRow">' + del + '<button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary" id="btnSave">Save</button></div>' +
      '<div class="foot-row" id="delRow" hidden><span class="spacer">Delete this record for good?</span><button type="button" class="btn" data-act="delCancel">Keep it</button><button type="button" class="btn danger" data-act="delYes">Yes, delete</button></div>' +
      '</div></form></section>';
  }

  function openSheet(id, pre, title) {
    var job = id ? S.jobs.find(function (j) { return j.id === id; }) : null;
    if (id && !job) return;
    S.editing = job ? job.id : 'new';
    lastFocus = document.activeElement;
    var sh = $('#sheet');
    sh.innerHTML = sheetHTML(job, pre, title || (job ? 'Edit record' : 'Log a problem'));
    sh.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    updateHint();
    setTimeout(function () { var f = $(job ? '#f-fix' : '#f-machine'); if (f) f.focus(); }, 30);
  }
  function closeSheet() {
    var sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; S.editing = null;
    document.documentElement.style.overflow = '';
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} }
  }

  /* Counts only earlier records, so editing an old record shows the right "Nth time". */
  function updateHint() {
    var box = $('#repeatHint'); if (!box) return;
    var mk = norm($('#f-serial').value) || norm($('#f-machine').value), pk = norm($('#f-problem').value);
    if (!mk || !pk) { box.innerHTML = ''; return; }
    var rep = $('#f-reported').value;
    var prior = S.jobs.filter(function (j) {
      if (j.id === S.editing) return false;
      if (machineKey(j) !== mk || problemKey(j) !== pk) return false;
      return !rep || !j.reportedAt || String(j.reportedAt) <= rep;
    });
    if (!prior.length) { box.innerHTML = ''; return; }
    prior.sort(function (a, b) { return String(b.reportedAt).localeCompare(String(a.reportedAt)); });
    var n = prior.length;
    box.innerHTML = '<div class="note">This problem was logged ' + n + (n === 1 ? ' time' : ' times') + ' before on this machine. Last on ' + esc(fmtDate(prior[0].reportedAt)) + '. This one is the ' + ord(n + 1) + ' time.</div>';
  }

  function showErr(msg) { var e = $('#formErr'); if (!e) return; e.textContent = msg; e.hidden = !msg; }

  async function saveForm() {
    var g = function (id) { return ($('#' + id).value || '').trim(); };
    var status = $('input[name="status"]:checked').value;
    var data = {
      machine: g('f-machine'), serial: g('f-serial'), customer: g('f-customer'), problem: g('f-problem'),
      category: $('#f-category').value, code: g('f-code'), what: g('f-what'),
      reportedAt: $('#f-reported').value, status: status, fixedAt: status === 'Fixed' ? $('#f-fixed').value : '',
      cause: g('f-cause'), fix: g('f-fix'), parts: g('f-parts'),
      priority: $('input[name="priority"]:checked').value, via: $('#f-via').value
    };
    if (!data.machine) { showErr('Enter the machine model.'); $('#f-machine').focus(); return; }
    if (!data.problem) { showErr('Enter what the problem is.'); $('#f-problem').focus(); return; }
    if (!parse(data.reportedAt)) { showErr('Enter the date and time it was reported.'); $('#f-reported').focus(); return; }
    if (status === 'Fixed') {
      if (!parse(data.fixedAt)) { showErr('Enter when it was fixed.'); $('#f-fixed').focus(); return; }
      if (parse(data.fixedAt) < parse(data.reportedAt)) { showErr('The fixed time is before the reported time. Check both dates.'); $('#f-fixed').focus(); return; }
    }
    showErr('');
    var old = S.editing && S.editing !== 'new' ? S.jobs.find(function (j) { return j.id === S.editing; }) : null;
    var nowIso = new Date().toISOString();
    var job = Object.assign({}, data, { id: old ? old.id : newId(), createdAt: old && old.createdAt ? old.createdAt : nowIso, updatedAt: nowIso, example: false });
    var btn = $('#btnSave'); btn.disabled = true;
    try { await store.save(job); closeSheet(); toast('Saved'); }
    catch (e) { btn.disabled = false; showErr(writeError(e)); }
  }

  async function deleteCurrent() {
    var id = S.editing; if (!id || id === 'new') return;
    try { await store.remove(id); closeSheet(); toast('Record deleted'); }
    catch (e) { showErr(writeError(e)); $('#delRow').hidden = true; $('#normalRow').hidden = false; }
  }

  async function removeExamples() {
    var ids = S.jobs.filter(function (j) { return j.example; }).map(function (j) { return j.id; });
    try { for (var i = 0; i < ids.length; i++) await store.remove(ids[i]); toast('Examples removed'); }
    catch (e) { toast(writeError(e)); }
  }

  /* ---------- export ---------- */
  function csvCell(v) { v = String(v == null ? '' : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  async function exportCSV() {
    var head = ['Reported', 'Status', 'Machine', 'Serial', 'Customer', 'Category', 'Problem', 'Alarm code', 'What happened', 'Cause', 'How fixed', 'Parts used', 'Fixed on', 'Time to fix', 'Occurrence on this machine', 'Priority', 'Handled via'];
    var lines = [head.map(csvCell).join(',')];
    D.asc.slice().reverse().forEach(function (j) {
      var ms = fixMs(j), o = D.occ[j.id];
      lines.push([fmtDT(j.reportedAt), j.status, j.machine, j.serial, j.customer, j.category, j.problem, j.code, j.what, j.cause, j.fix, j.parts,
        j.fixedAt ? fmtDT(j.fixedAt) : '', ms != null ? dur(ms) : '', o ? o.n : 1, j.priority || 'Normal', j.via || ''].map(csvCell).join(','));
    });
    var body = lines.join('\r\n');
    var csv = '\uFEFF' + body;
    var d = null;
    try { if (window.claude && window.claude.use) d = await window.claude.use('downloads'); } catch (e) { d = null; }
    if (d) {
      try { await d.save({ filename: 'machine-fix-log.csv', data: csv }); toast('Export ready'); }
      catch (e) { if (!e || e.code !== 'declined') toast('Could not create the file.'); }
      return;
    }
    /* Plain browser: download the file directly. */
    try {
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'machine-fix-log.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Export ready');
    } catch (e) {
      try { await navigator.clipboard.writeText(body); toast('Copied the records as CSV text'); }
      catch (e2) { toast('Export is not available here.'); }
    }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'new') openSheet(null);
    else if (act === 'tab') { S.tab = t.getAttribute('data-tab'); renderAll(true); }
    else if (act === 'status') { S.status = t.getAttribute('data-v'); renderView(true); }
    else if (act === 'clearMachine') { S.machine = ''; renderView(true); }
    else if (act === 'urgent') { S.urgent = !S.urgent; renderView(true); }
    else if (act === 'clearFilters') { S.q = ''; S.status = 'all'; S.cat = 'all'; S.machine = ''; S.urgent = false; renderView(true); }
    else if (act === 'open') openSheet(t.getAttribute('data-id'));
    else if (act === 'machine') { S.machine = t.getAttribute('data-mk'); S.urgent = false; S.status = 'all'; S.cat = 'all'; S.q = ''; S.tab = 'jobs'; renderAll(true); window.scrollTo(0, 0); }
    else if (act === 'again') {
      var g = D.groups.get(t.getAttribute('data-gk')); if (!g) return;
      var l = g.jobs[g.jobs.length - 1];
      openSheet(null, { machine: l.machine, serial: l.serial, customer: l.customer, problem: l.problem, category: l.category, code: l.code }, 'Log it again');
    }
    else if (act === 'close') closeSheet();
    else if (act === 'delAsk') { $('#normalRow').hidden = true; $('#delRow').hidden = false; }
    else if (act === 'delCancel') { $('#delRow').hidden = true; $('#normalRow').hidden = false; }
    else if (act === 'delYes') deleteCurrent();
    else if (act === 'export') exportCSV();
    else if (act === 'removeExamples') removeExamples();
  });
  document.addEventListener('keydown', function (e) {
    var open = !$('#sheet').hidden;
    if (e.key === 'Escape' && open) { closeSheet(); return; }
    /* Keep Tab inside the open form. */
    if (e.key === 'Tab' && open) {
      var f = Array.prototype.filter.call($('#sheet').querySelectorAll('button, input, select, textarea, [tabindex="0"]'), function (el) {
        return !el.disabled && el.offsetParent !== null && !(el.type === 'radio' && !el.checked && false) && el.getAttribute('tabindex') !== '-1' && el.className.indexOf('scrim') < 0;
      });
      /* Radio inputs are visually hidden, skip them in the loop ends. */
      f = f.filter(function (el) { return el.type !== 'radio'; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'q') { S.q = t.value; renderJobList(); }
    else if (t.closest && t.closest('#jobForm')) {
      if (t.id === 'f-serial' || t.id === 'f-machine' || t.id === 'f-problem' || t.id === 'f-reported') updateHint();
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'catSel') { S.cat = t.value; renderJobList(); }
    else if (t.name === 'status') {
      var fixed = t.value === 'Fixed';
      $('#fixedWrap').hidden = !fixed;
      if (fixed && !$('#f-fixed').value) $('#f-fixed').value = nowLocal();
    }
    else if (t.id === 'f-serial') {
      var k = norm(t.value); if (!k) return;
      var m = D.machines.get(k);
      if (m) {
        if (!$('#f-machine').value.trim() && m.model) $('#f-machine').value = m.model;
        if (!$('#f-customer').value.trim() && m.customer) $('#f-customer').value = m.customer;
      }
      updateHint();
    }
    else if (t.id === 'f-problem') {
      var p = norm(t.value), cat = $('#f-category');
      if (p && cat.value === 'Other') {
        for (var i = D.asc.length - 1; i >= 0; i--) { if (problemKey(D.asc[i]) === p && D.asc[i].category) { cat.value = D.asc[i].category; break; } }
      }
      updateHint();
    }
  });
  document.addEventListener('submit', function (e) { if (e.target.id === 'jobForm') { e.preventDefault(); saveForm(); } });

  /* ---------- boot ---------- */
  async function boot() {
    S.jobs = []; renderAll(true);
    var db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
    if (db) {
      S.mode = 'db';
      col = db.collection('jobs');
      col.onSnapshot(function (snap) {
        S.jobs = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        S.loaded = true; S.dbError = '';
        renderAll(false);
      }, function () { S.dbError = 'unreachable'; S.loaded = true; renderAll(false); });
    } else {
      S.mode = 'local'; S.jobs = lsLoad(); S.loaded = true; renderAll(true);
    }
  }
  boot();
})();
</script>
</body>
</html>
